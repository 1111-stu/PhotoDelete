<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>删图 · 首页文案溢出体检 (中 / ES)</title>
<style>
  @font-face{font-family:Archivo;font-weight:500;src:url('fonts/Archivo-500.woff2')}
  @font-face{font-family:Archivo;font-weight:700;src:url('fonts/Archivo-700.woff2')}
  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg:#0A0A0D; --card:#16161A; --card2:#1E1E24; --card3:#292930;
    --ink:#fff; --ink2:rgba(255,255,255,.55); --ink3:rgba(255,255,255,.34);
    --amber:#F5B03C; --amber-lt:#FFC85E; --on-amber:#1A1206;
    --danger:#FF6B5A; --success:#7BC98A; --fav:#FF7BA8;
    --sep:rgba(255,255,255,.07);
    --blk2a:#FF9E7D; --blk2b:#F2704A; --blk2-ink:#2E0F06;
    --k:1;                         /* 字号倍率: 模拟 Dynamic Type */
    --flag:0;                      /* 1 = 显示溢出标记 */
  }

  body { font-family:"Archivo",-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;
    background:#07070A; color:#F4F4F6; -webkit-font-smoothing:antialiased;
    font-feature-settings:"tnum"; min-height:100vh; }
  .num { font-variant-numeric:tabular-nums;
    font-family:ui-rounded,"SF Pro Rounded",-apple-system,"PingFang SC",sans-serif; }

  .page { display:flex; gap:56px; align-items:flex-start; justify-content:center;
    padding:0 40px 80px; max-width:1320px; margin:0 auto; flex-wrap:wrap; }

  /* ============ 顶部工具条 ============ */
  .bar { position:sticky; top:0; z-index:200; background:rgba(12,12,16,.94);
    backdrop-filter:blur(20px); border-bottom:1px solid rgba(255,255,255,.08);
    margin-bottom:34px; }
  .bar-in { max-width:1320px; margin:0 auto; padding:14px 40px;
    display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
  .bar .brand { font-size:13px; font-weight:700; letter-spacing:.02em; }
  .bar .brand span { color:#F5B03C; font-weight:300; }
  .grp { display:flex; align-items:center; gap:8px; }
  .grp > label { font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:#7C838A; font-weight:600; }
  .seg2 { display:flex; background:#1A1A20; border-radius:999px; padding:3px; gap:2px; }
  .seg2 button { border:none; background:transparent; color:#9AA1A8; cursor:pointer;
    font-family:inherit; font-size:12.5px; font-weight:600; padding:7px 15px;
    border-radius:999px; transition:background .16s,color .16s; }
  .seg2 button.on { background:#F5B03C; color:#1A1206; }
  .count { margin-left:auto; font-size:12.5px; font-weight:700; padding:8px 15px;
    border-radius:999px; }
  .count.ok { background:rgba(123,201,138,.16); color:#7BC98A; }
  .count.bad { background:rgba(255,107,90,.16); color:#FF6B5A; }

  /* ============ 溢出报告 ============ */
  .report { flex:1; min-width:330px; max-width:430px; position:sticky; top:96px; }
  .report h2 { font-size:15px; font-weight:700; margin-bottom:4px; }
  .report .hint { font-size:12px; color:#8E959C; line-height:1.7; margin-bottom:16px; }
  .rlist { display:flex; flex-direction:column; gap:8px; max-height:62vh; overflow-y:auto; }
  .ritem { background:#121216; border-radius:12px; padding:11px 14px;
    border-left:3px solid #FF6B5A; }
  .ritem.wrap { border-left-color:#FFB03C; }
  .ritem .r-top { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .ritem .r-key { font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    color:#7C838A; font-weight:600; }
  .ritem .r-px { font-size:11.5px; font-weight:700; color:#FF6B5A; white-space:nowrap; }
  .ritem.wrap .r-px { color:#FFB03C; }
  .ritem .r-txt { font-size:12.5px; margin-top:5px; color:#E7E9EB; word-break:break-word; }
  .ritem .r-dim { font-size:11px; margin-top:6px; color:#7C838A; font-variant-numeric:tabular-nums; }
  .rtight { margin-top:14px; border-top:1px solid rgba(255,255,255,.08); padding-top:12px; }
  .rt-head { font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    color:#7C838A; font-weight:600; margin-bottom:8px; }
  .rt-row { display:flex; justify-content:space-between; gap:12px; font-size:12px;
    color:#A8AFB6; padding:5px 0; }
  .rt-row b { color:#7BC98A; font-weight:600; font-variant-numeric:tabular-nums;
    white-space:nowrap; }
  .empty { font-size:13px; color:#7BC98A; background:rgba(123,201,138,.1);
    border-radius:12px; padding:16px; text-align:center; }

  /* ============ 手机 ============ */
  .phone { position:relative; width:390px; height:844px; border-radius:52px; overflow:hidden;
    background:var(--bg); border:1px solid rgba(255,255,255,.09);
    box-shadow:0 40px 90px rgba(0,0,0,.8); flex-shrink:0;
    touch-action:pan-y; }
  .statusbar { position:absolute; top:0; left:0; right:0; height:50px; z-index:30;
    display:flex; align-items:center; justify-content:space-between; padding:0 30px 0 32px;
    font-size:15px; font-weight:600; }
  .status-icons { display:flex; align-items:center; gap:6px; }
  .status-icons svg { display:block; }
  .scroll { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
    padding:0 16px 108px; scrollbar-width:none; }
  .scroll::-webkit-scrollbar { display:none; }

  .top-bar { display:flex; align-items:center; justify-content:space-between; padding:54px 4px 8px; }
  .top-bar h1 { font-size:calc(34px * var(--k)); font-weight:700; letter-spacing:-.03em; }
  .top-acts { display:flex; gap:10px; }
  .tbtn { position:relative; width:42px; height:42px; border-radius:50%; background:var(--card2);
    display:flex; align-items:center; justify-content:center; color:var(--ink2);
    border:none; cursor:pointer; font-family:inherit; flex-shrink:0; }
  .tbtn svg { width:20px; height:20px; }
  .tbadge { position:absolute; top:-2px; right:-2px; min-width:20px; height:20px;
    border-radius:999px; background:var(--danger); color:#fff;
    font-size:calc(11.5px * var(--k)); font-weight:700; display:flex; align-items:center;
    justify-content:center; padding:0 5px; box-shadow:0 0 0 2.5px var(--bg); }

  /* ---- 待整理 ---- */
  .hero { background:var(--card); border-radius:26px; padding:20px 20px 16px; }
  .hero-top { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .hero-top b { font-size:calc(15px * var(--k)); font-weight:600; }
  .hero-top small { font-size:calc(12.5px * var(--k)); color:var(--ink3); white-space:nowrap; }
  .hero-num { font-size:calc(46px * var(--k)); font-weight:700; letter-spacing:-.045em;
    line-height:1; margin-top:14px; }
  .hero-num i { font-style:normal; font-size:calc(20px * var(--k)); color:var(--ink2);
    margin-left:3px; letter-spacing:0; font-weight:600; }
  .hero-sub { font-size:calc(13.5px * var(--k)); color:var(--ink2); margin-top:9px; }
  .hero-bar { height:6px; border-radius:999px; background:rgba(255,255,255,.09);
    overflow:hidden; margin-top:16px; }
  .hero-bar i { display:block; height:100%; width:62%; border-radius:999px;
    background:linear-gradient(90deg,#F09A22,var(--amber-lt)); }

  .band-label { font-size:calc(12px * var(--k)); color:var(--ink3); margin:18px 0 9px; }
  .band { display:flex; background:var(--card2); border-radius:18px; overflow:hidden; }
  .seg { flex:1; min-width:0; background:transparent; border:none; cursor:pointer;
    font-family:inherit; color:inherit; padding:13px 8px 12px; display:flex;
    flex-direction:column; align-items:center; gap:4px; position:relative; }
  .seg + .seg::before { content:""; position:absolute; left:0; top:12px; bottom:12px;
    width:1px; background:var(--sep); }
  .seg-label { font-size:calc(12px * var(--k)); color:var(--ink3);
    display:flex; align-items:center; gap:3px; white-space:nowrap; }
  .seg-label svg { width:10px; height:10px; flex-shrink:0; }
  .seg-num { font-size:calc(26px * var(--k)); font-weight:700; letter-spacing:-.03em;
    line-height:1.15; white-space:nowrap; }
  .seg-sub { font-size:calc(10.5px * var(--k)); color:var(--ink3); white-space:nowrap; }

  /* ---- 色块 ---- */
  .duo { display:flex; gap:12px; margin-top:14px; height:168px; }
  .mini { flex:1; min-width:0; border-radius:22px; position:relative; overflow:hidden;
    display:flex; flex-direction:column; }
  .mini.b1 { background:linear-gradient(135deg,var(--amber-lt),#F09A22); color:var(--on-amber); }
  .mini.b2 { background:linear-gradient(135deg,var(--blk2a),var(--blk2b)); color:var(--blk2-ink); }
  .pane { padding:16px 16px 34px; display:flex; flex-direction:column; height:100%; }
  .pane b { font-size:calc(17px * var(--k)); font-weight:700; letter-spacing:-.015em; }
  .pane small { font-size:calc(12.5px * var(--k)); font-weight:500; opacity:.72;
    margin-top:4px; }
  .thumbs { margin-top:auto; display:flex; gap:6px; align-items:flex-end; }
  .thumbs .th { border-radius:8px; overflow:hidden; border:1.5px solid rgba(255,255,255,.45); }
  .thumbs .th svg { display:block; width:100%; height:100%; }
  .thumbs .t1 { width:40px; height:48px; }
  .thumbs .t2 { width:32px; height:40px; }
  .dots { position:absolute; left:0; right:0; bottom:13px; display:flex;
    justify-content:center; gap:5px; }
  .dots i { width:5px; height:5px; border-radius:50%; background:currentColor; opacity:.32; }
  .dots i.on { opacity:.95; width:14px; border-radius:999px; }

  /* ---- 分区 ---- */
  .glabel { display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    padding:24px 6px 9px; }
  .glabel b { font-size:calc(14px * var(--k)); font-weight:700; white-space:nowrap; }
  .glabel span { font-size:calc(12.5px * var(--k)); color:var(--amber); font-weight:600;
    white-space:nowrap; }
  .card { background:var(--card); border-radius:22px; overflow:hidden; }

  .cln { display:flex; align-items:center; gap:13px; padding:14px 18px; position:relative;
    border:none; background:transparent; width:100%; font-family:inherit; color:inherit;
    cursor:pointer; text-align:left; }
  .cln + .cln::before { content:""; position:absolute; top:0; left:18px; right:18px;
    height:1px; background:var(--sep); }
  .cln .ci { width:36px; height:36px; border-radius:12px; background:rgba(255,255,255,.07);
    display:flex; align-items:center; justify-content:center; color:var(--ink2); flex-shrink:0; }
  .cln .ci svg { width:18px; height:18px; }
  .cln .cbody { flex:1; min-width:0; }
  .cln .cbody b { display:block; font-size:calc(14.5px * var(--k)); font-weight:600; }
  .cln .cbar { display:block; height:5px; border-radius:999px;
    background:rgba(255,255,255,.08); margin-top:8px; overflow:hidden; max-width:130px; }
  .cln .cbar i { display:block; height:100%; border-radius:999px;
    background:linear-gradient(90deg,#F09A22,var(--amber-lt)); }
  .cln .cval { font-size:calc(15px * var(--k)); font-weight:700; color:var(--amber);
    flex-shrink:0; white-space:nowrap; }
  .cln .chev { width:12px; height:12px; color:var(--ink3); flex-shrink:0; }

  .tool { display:flex; align-items:center; gap:13px; padding:15px 18px; position:relative;
    border:none; background:transparent; width:100%; font-family:inherit; color:inherit;
    cursor:pointer; text-align:left; }
  .tool + .tool::before { content:""; position:absolute; top:0; left:18px; right:18px;
    height:1px; background:var(--sep); }
  .tool .tbody { flex:1; min-width:0; }
  .tool .tbody b { display:block; font-size:calc(14.5px * var(--k)); font-weight:600; }
  .tool .tbody span { font-size:calc(11.5px * var(--k)); color:var(--ink3);
    display:block; margin-top:3px; }
  .tool .tval { font-size:calc(15px * var(--k)); font-weight:600; color:var(--ink2);
    white-space:nowrap; }
  .tool .chev { width:12px; height:12px; color:var(--ink3); }

  .tabbar { position:absolute; z-index:30; left:14px; right:14px; bottom:22px; height:76px;
    border-radius:999px; background:rgba(28,28,34,.92); backdrop-filter:blur(28px);
    display:flex; align-items:center; justify-content:space-around; padding:0 8px;
    box-shadow:0 18px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06) inset; }
  .tab { display:flex; flex-direction:column; align-items:center; gap:3px; width:88px;
    min-width:0; }
  .tab .tico { width:46px; height:46px; border-radius:50%; display:flex;
    align-items:center; justify-content:center; flex-shrink:0; }
  .tab svg { width:23px; height:23px; }
  .tab span { font-size:calc(11px * var(--k)); font-weight:500; white-space:nowrap; }
  .tab.on .tico { background:linear-gradient(135deg,var(--amber-lt),#F09A22); }
  .tab.on svg { color:var(--on-amber); }
  .tab.on span { color:var(--amber); font-weight:700; }
  .tab.off { color:var(--ink3); }
  .home-indicator { position:absolute; z-index:31; bottom:9px; left:50%;
    transform:translateX(-50%); width:128px; height:4px; border-radius:999px;
    background:rgba(255,255,255,.26); }

  /* ---- 溢出标记 ---- */
  [data-i18n] { white-space:nowrap; }
  body.flag .ovf { outline:2px solid #FF6B5A; outline-offset:1px; border-radius:3px;
    background:rgba(255,107,90,.16); position:relative; }
  body.flag .ovf::after { content:attr(data-ovf); position:absolute; top:-15px; right:0;
    font-size:9.5px; font-weight:700; color:#fff; background:#FF6B5A;
    padding:1px 5px; border-radius:4px; white-space:nowrap; z-index:50; }
  body.flag .wrp { outline:2px solid #FFB03C; outline-offset:1px; border-radius:3px; }

  @media (max-width:1140px) { .page { gap:34px; } .report { position:static; max-width:390px; } }
</style>
</head>
<body>

<!-- ================= 工具条 ================= -->
<div class="bar"><div class="bar-in">
  <div class="brand">删图 · 首页文案 <span>溢出体检</span></div>
  <div class="grp">
    <label>语言</label>
    <div class="seg2" id="langSw">
      <button data-lang="zh" class="on">中文</button>
      <button data-lang="es">Español</button>
      <button data-lang="de">Deutsch</button>
    </div>
  </div>
  <div class="grp">
    <label>字号</label>
    <div class="seg2" id="scaleSw">
      <button data-k="1" class="on">100%</button>
      <button data-k="1.3">130%</button>
      <button data-k="1.6">160%</button>
    </div>
  </div>
  <div class="grp">
    <div class="seg2" id="flagSw">
      <button data-flag="0" class="on">关标记</button>
      <button data-flag="1">标出溢出</button>
    </div>
  </div>
  <div class="count ok" id="count">—</div>
</div></div>

<div class="page">
  <!-- ============ 报告 ============ -->
  <aside class="report">
    <h2>溢出报告</h2>
    <p class="hint">元素宽度超出它所在容器(固定分栏)即计入。红色 = 横向溢出必须被截断;黄色 = 换行会撑高布局。<b>点右上「标出溢出」可让超标元素在手机上直接标红。</b></p>
    <div class="rlist" id="rlist"></div>
  </aside>

  <!-- ============ 手机 ============ -->
  <div class="phone" id="phone">
    <div class="statusbar"><span>9:41</span>

          <span class="tval num">1,024</span><svg class="chev"><use href="#i-chev"/></svg></button>
        <button class="tool"><span class="tbody"><b data-i18n="t2">视频压缩</b><span data-i18n="smaller2">变小,不删除</span></span>

<script>
/* ============ 文案表 (真实长度, 不做人为缩短) ============ */
const I18N = {
  zh: {
    title:'整理', pending:'待整理', organized:'已整理', unit_photos:'张',
    canFree:'预计可释放', byPeriod:'按时间段开始',
    week:'本周', month:'本月', year:'本年',
    free256:'可释放 256MB', free12:'可释放 1.2GB', free86:'可释放 8.6GB',
    random:'随机整理', maxItems:'最多 120 项',
    history:'往年今日', histSub:'前年今天 · 3 张',
    cleanup:'专项清理', cleanupEst:'预计可清理 2.4 GB',
    c1:'相似与重复', c2:'视频', c3:'截图', c4:'大文件',
    tools:'工具', t1:'图片压缩', t2:'视频压缩', smaller:'变小,不删除', smaller2:'变小,不删除',
    tab1:'整理', tab2:'相册', tab3:'设置'
  },
  es: {
    title:'Ordenar', pending:'Por organizar', organized:'Organizado', unit_photos:'fotos',
    canFree:'Se liberan', byPeriod:'Empezar por periodo',
    week:'Esta semana', month:'Este mes', year:'Este año',
    free256:'Libera 256 MB', free12:'Libera 1,2 GB', free86:'Libera 8,6 GB',
    random:'Ordenar al azar', maxItems:'Máx. 120 elementos',
    history:'Un día como hoy', histSub:'Hace 2 años · 3 fotos',
    cleanup:'Limpieza específica', cleanupEst:'Se limpian 2,4 GB',
    c1:'Similares y duplicadas', c2:'Vídeos', c3:'Capturas', c4:'Archivos grandes',
    tools:'Herramientas', t1:'Comprimir fotos', t2:'Comprimir vídeos',
    smaller:'Más pequeño, sin borrar', smaller2:'Más pequeño, sin borrar',
    tab1:'Organizar', tab2:'Álbumes', tab3:'Ajustes'
  },
  de: {
    title:'Sortieren', pending:'Zu sortieren', organized:'Sortiert', unit_photos:'Fotos',
    canFree:'Freizugeben', byPeriod:'Nach Zeitraum starten',
    week:'Diese Woche', month:'Dieser Monat', year:'Dieses Jahr',
    free256:'256 MB frei', free12:'1,2 GB frei', free86:'8,6 GB frei',
    random:'Zufällig sortieren', maxItems:'Max. 120 Elemente',
    history:'Heute vor Jahren', histSub:'Vor 2 Jahren · 3 Fotos',
    cleanup:'Spezielle Reinigung', cleanupEst:'2,4 GB bereinigbar',
    c1:'Ähnliche & Duplikate', c2:'Videos', c3:'Screenshots', c4:'Große Dateien',
    tools:'Werkzeuge', t1:'Fotos komprimieren', t2:'Videos komprimieren',
    smaller:'Kleiner, nicht löschen', smaller2:'Kleiner, nicht löschen',
    tab1:'Sortieren', tab2:'Alben', tab3:'Einstellungen'
  }
};

/* 数字也随时间格式变化 (西/德用 . 作千位, , 作小数) */
const NUM = {
  zh: { hero:'2,974', free:'8.6 GB', c1:'1.4 GB', c2:'0.5 GB', c3:'0.3 GB', c4:'0.2 GB', t1:'1,024', t2:'89' },
  es: { hero:'2.974', free:'8,6 GB', c1:'1,4 GB', c2:'0,5 GB', c3:'0,3 GB', c4:'0,2 GB', t1:'1.024', t2:'89' },
  de: { hero:'2.974', free:'8,6 GB', c1:'1,4 GB', c2:'0,5 GB', c3:'0,3 GB', c4:'0,2 GB', t1:'1.024', t2:'89' }
};

const phone = document.getElementById('phone');
const rlist = document.getElementById('rlist');
const countEl = document.getElementById('count');
let lang = 'zh', k = 1;

function applyLang(l) {
  lang = l;
  const d = I18N[l];
  phone.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (d[key] !== undefined) el.textContent = d[key];
  });
  // 数字格式
  const n = NUM[l];
  phone.querySelector('.hero-num span').textContent = n.hero;
  phone.querySelector('.hero-sub .num').textContent = n.free;
  const cvals = phone.querySelectorAll('.cval');
  cvals[0].textContent = n.c1; cvals[1].textContent = n.c2;
  cvals[2].textContent = n.c3; cvals[3].textContent = n.c4;
  const tv = phone.querySelectorAll('.tval');
  tv[0].textContent = n.t1; tv[1].textContent = n.t2;
  measure();
}

function applyScale(v) { k = v; document.documentElement.style.setProperty('--k', v); measure(); }

/* ============ 溢出检测 ============ */
// 文本的真实渲染宽度 (往返于 Range, 不受元素盒宽影响)
function textWidth(el) {
  const r = document.createRange();
  r.selectNodeContents(el);
  const rects = r.getClientRects();
  let max = 0;
  for (const rc of rects) max = Math.max(max, rc.width);
  return max;
}

// 父元素是否"由内容撑开" (shrink-to-fit) —— 这种宽度不能当作约束, 否则会自我循环
function isShrinkToFit(p) {
  const gp = p.parentElement;
  if (gp) {
    const gcs = getComputedStyle(gp);
    const colFlex = gcs.display.includes('flex') && gcs.flexDirection.startsWith('column');
    if (colFlex && gcs.alignItems !== 'stretch') return true;
  }
  return getComputedStyle(p).display.startsWith('inline');
}

// 沿祖先链取"最紧的约束宽度", 这才是这条文案真正能用的横向空间
function slotAvail(el) {
  let avail = Infinity;
  let node = el;
  while (node && node !== phone) {
    const p = node.parentElement;
    if (!p || p === phone || p.classList.contains('scroll')) break;
    if (!isShrinkToFit(p)) {
      const pcs = getComputedStyle(p);
      const pr = p.getBoundingClientRect();
      let a = pr.width - parseFloat(pcs.paddingLeft) - parseFloat(pcs.paddingRight);
      const rowFlex = pcs.display.includes('flex') && pcs.flexDirection.startsWith('row');
      if (rowFlex) {
        for (const c of p.children) {
          if (c === node) continue;
          const ccs = getComputedStyle(c);
          if (ccs.position === 'absolute' || ccs.display === 'none' || !c.offsetWidth) continue;
          a -= c.getBoundingClientRect().width;
        }
      }
      avail = Math.min(avail, a);
    }
    node = p;
  }
  return avail;
}

function measure() {
  phone.querySelectorAll('[data-i18n]').forEach(el =>
    el.classList.remove('ovf', 'wrp'));

  const hits = [];
  phone.querySelectorAll('[data-i18n]').forEach(el => {
    const tw = textWidth(el);
    const av = slotAvail(el);
    if (!isFinite(av) || tw === 0) return;
    const over = Math.round(tw - av);
    const lines = el.getClientRects().length;
    if (over > 1) { el.classList.add('ovf'); el.dataset.ovf = '+' + over + 'px'; }
    else if (lines > 1) el.classList.add('wrp');
    hits.push({ key: el.dataset.i18n, text: el.textContent,
                tw: Math.round(tw), av: Math.round(av), over, lines });
  });

  hits.sort((a, b) => b.over - a.over);

  const bad = hits.filter(h => h.over > 1);
  rlist.innerHTML = bad.length ? '' : '<div class="empty">✓ 全部文案都在容器内放得下</div>';
  bad.forEach(h => {
    const d = document.createElement('div');
    d.className = 'ritem';
    d.innerHTML =
      '<div class="r-top"><span class="r-key">' + h.key + '</span>' +
      '<span class="r-px">超出 ' + h.over + ' px</span></div>' +
      '<div class="r-txt">' + h.text.replace(/</g, '&lt;') + '</div>' +
      '<div class="r-dim">文案 ' + h.tw + ' px &nbsp;/&nbsp; 可用 ' + h.av + ' px</div>';
    rlist.appendChild(d);
  });

  // 最紧的几条 (即使没溢出也列出来, 看余量)
  const tight = hits.filter(h => h.over <= 1).slice(0, 6);
  if (tight.length) {
    const t = document.createElement('div');
    t.className = 'rtight';
    t.innerHTML = '<div class="rt-head">余量最小的几条</div>' + tight.map(h =>
      '<div class="rt-row"><span>' + h.text.replace(/</g, '&lt;') + '</span>' +
      '<b>' + h.tw + ' / ' + h.av + ' px</b></div>').join('');
    rlist.appendChild(t);
  }

  countEl.textContent = bad.length ? bad.length + ' 处超标' : '✓ 全部放得下';
  countEl.className = 'count ' + (bad.length ? 'bad' : 'ok');
}

/* ============ 开关 ============ */
function wire(id, fn) {
  document.getElementById(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [...e.currentTarget.children].forEach(x => x.classList.remove('on'));
    b.classList.add('on'); fn(b);
  });
}
wire('langSw', b => applyLang(b.dataset.lang));
wire('scaleSw', b => applyScale(parseFloat(b.dataset.k)));
wire('flagSw', b => document.body.classList.toggle('flag', b.dataset.flag === '1'));

/* 初始 */
applyLang('zh');
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(measure);   // 字体就位后重测一次, 避免用回退字宽度
}
window.addEventListener('resize', measure);
</script>
