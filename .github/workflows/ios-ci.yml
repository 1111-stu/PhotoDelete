name: iOS CI

on:
  pull_request:
    paths:
      - ios-app/**
      - scripts/**
      - .github/workflows/ios-ci.yml
  push:
    branches: [main]
    paths:
      - ios-app/**
      - scripts/**
      - .github/workflows/ios-ci.yml
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          xcodebuild -version

      - name: Resolve simulator
        id: simulator
        run: |
          destination="$(scripts/resolve-ios-simulator-destination.sh)"
          echo "destination=$destination" >> "$GITHUB_OUTPUT"
          echo "$destination"

      - name: Check localization sources
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/check-localization.py

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project ios-app/PhotoDelete.xcodeproj \
            -scheme PhotoDelete \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath ios-app/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Check compiled localizations
        run: python3 scripts/check-localization.py --derived-data ios-app/DerivedData

      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -project ios-app/PhotoDelete.xcodeproj \
            -scheme PhotoDelete \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath ios-app/DerivedData \
            -only-testing:PhotoDeleteTests \
            CODE_SIGNING_ALLOWED=NO

  ui-smoke-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          xcodebuild -version

      - name: Resolve simulator
        id: simulator
        run: |
          destination="$(scripts/resolve-ios-simulator-destination.sh)"
          echo "destination=$destination" >> "$GITHUB_OUTPUT"
          echo "$destination"

      - name: Build for UI testing
        run: |
          xcodebuild build-for-testing \
            -project ios-app/PhotoDelete.xcodeproj \
            -scheme PhotoDelete \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath ios-app/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Run UI smoke tests
        run: |
          xcodebuild test-without-building \
            -project ios-app/PhotoDelete.xcodeproj \
            -scheme PhotoDelete \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath ios-app/DerivedData \
            -only-testing:PhotoDeleteUITests \
            CODE_SIGNING_ALLOWED=NO
